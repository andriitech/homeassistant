listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
# Anonymous is fine on a home LAN behind NAT. To require a login instead:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd homeassistant
# then replace the line below with:  password_file /mosquitto/config/passwd
allow_anonymous true
